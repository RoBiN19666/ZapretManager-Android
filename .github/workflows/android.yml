name: Android CI

# Сборка запускается не на каждый коммит, а только:
#   • push тега v* — релиз этой версии;
#   • ручной запуск (Actions → Android CI → Run workflow) — релиз текущей версии из version.txt
#     или явно указанной.
# Текст релиза берётся из CHANGELOG.md (раздел «## <версия>»).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для релиза (пусто — из version.txt)'
        required: false
        default: ''

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не найден в $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Native Telegram runtime (libtgwsproxy.so)
        run: bash scripts/build-tgws.sh

      - name: Version
        id: vars
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d '[:space:]' < version.txt)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # versionCode должен расти от релиза к релизу для самообновления.
          echo "version_code=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_OUTPUT"
          echo "Релиз: $VERSION (code $(( GITHUB_RUN_NUMBER + 100 )))"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PappVersionName=${{ steps.vars.outputs.version }} \
            -PappVersionCode=${{ steps.vars.outputs.version_code }}

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          NAME="ZapretManager-Android-universal-v${{ steps.vars.outputs.version }}.apk"
          cp "$SRC" "dist/$NAME"
          ( cd dist && sha256sum "$NAME" | awk '{print $1}' > "$NAME.sha256" )
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapretManager-Android-${{ steps.vars.outputs.version }}
          path: dist/*
          retention-days: 30

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          # Берём раздел «## VERSION» до следующего «## ».
          awk -v ver="$VERSION" '
            index($0, "## " ver) == 1 { found=1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Сборка v$VERSION. Подробности — в CHANGELOG.md." > release-notes.md
          fi
          printf '\n\n---\n**Установка:** скачайте APK и подтвердите установку из этого источника.\n' >> release-notes.md
          printf '**Проверка целостности:** SHA-256 в файле `*.apk.sha256`.\n' >> release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.vars.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Zapret Manager $TAG" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Bump patch version
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Пока идёт сборка, в main мог прилететь другой коммит — подтягиваем и повторяем.
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            VERSION="$(tr -d '[:space:]' < version.txt)"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "$NEXT" > version.txt
            git add version.txt
            git commit -m "chore: версия $NEXT [skip ci]" || true
            if git push origin HEAD:main; then
              echo "Версия поднята до $NEXT"
              exit 0
            fi
            sleep 5
          done
          echo "Не удалось поднять версию: main постоянно меняется" >&2
          exit 1
