name: Android CI

# Релиз запускается вручную (Actions → Android CI → Run workflow) или тегом v*.
# Подпись выполняется только в release-job из GitHub Secrets; в репозитории
# ключей и паролей нет.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для релиза (пусто — из version.txt)'
        required: false
        default: ''

concurrency:
  # Релиз нельзя отменять на полпути: между подписью и публикацией остался бы
  # несобранный/неподписанный артефакт. Поэтому новые запуски встают в очередь,
  # а не вытесняют текущий.
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не найден в $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Go 1.25
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25.x'

      - name: Verify Go modules
        working-directory: third_party/tgwsproxy/native/tgwsproxy
        run: |
          go mod download
          go mod verify

      - name: Native Telegram runtime (libtgwsproxy.so)
        run: bash scripts/build-tgws.sh

      - name: Version
        id: vars
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(tr -d '[:space:]' < version.txt)"
          fi
          CODE="$(tr -d '[:space:]' < version-code.txt)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Некорректная версия: $VERSION" >&2
            exit 1
          fi
          if ! printf '%s' "$CODE" | grep -Eq '^[0-9]+$'; then
            echo "Некорректный versionCode: $CODE" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Релиз: $VERSION (code $CODE)"

      - name: Unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Build unsigned release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PappVersionName=${{ steps.vars.outputs.version }} \
            -PappVersionCode=${{ steps.vars.outputs.code }}

      - name: Upload unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-unsigned
          path: unsigned

      - name: Version
        id: vars
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(tr -d '[:space:]' < version.txt)"
          fi
          CODE="$(tr -d '[:space:]' < version-code.txt)"
          # Та же валидация, что в build-job: тег вида v1.2.3-rc ломал бы имя ассета.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Некорректная версия: $VERSION" >&2
            exit 1
          fi
          if ! printf '%s' "$CODE" | grep -Eq '^[0-9]+$'; then
            echo "Некорректный versionCode: $CODE" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Sign APK with release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Нет секрета ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          # Явно предпочитаем universal-сборку: при появлении ABI-splits `find | head`
          # брал произвольный файл.
          APK="$(find unsigned -name '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            APK="$(find unsigned -name '*.apk' -print -quit)"
          fi
          test -n "$APK"
          mkdir -p dist
          VERSION="${{ steps.vars.outputs.version }}"
          OUT="dist/ZapretManager-Android-universal-v${VERSION}.apk"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT"
          "$BT/aapt2" dump badging "$OUT" | grep -E "package:|sdkVersion|targetSdkVersion"
          ( cd dist && sha256sum "$(basename "$OUT")" | awk '{print $1}' > "$(basename "$OUT").sha256" )
          ( cd dist && sha256sum "$(basename "$OUT")" > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          # Заголовок сравниваем целиком: index()-подход ловил «## 2.0.1» в «## 2.0.10».
          awk -v ver="$VERSION" '
            index($0, "## ") == 1 {
              if (found) exit
              header = substr($0, 4)
              sub(/[ \t]+$/, "", header)
              if (header == ver) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Сборка v$VERSION. Подробности — в CHANGELOG.md." > release-notes.md
          fi
          printf '\n\n---\n**Перед обновлением** сделайте резервную копию: «Настройки → Резервная копия → Экспорт». Секрет Telegram-прокси в архив не входит — после восстановления ссылку нужно применить в Telegram заново.\n' >> release-notes.md
          printf '\n**Проверка целостности:** SHA-256 в файле `*.apk.sha256`.\n' >> release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.vars.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.sha256 dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/*.apk dist/*.sha256 dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Zapret Manager $TAG" \
              --notes-file release-notes.md \
              --latest
          fi

  bump:
    needs: release
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            VERSION="$(tr -d '[:space:]' < version.txt)"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
            CODE="$(tr -d '[:space:]' < version-code.txt)"
            NEXT_CODE="$((CODE + 1))"
            echo "$NEXT" > version.txt
            echo "$NEXT_CODE" > version-code.txt
            git add version.txt version-code.txt
            git commit -m "chore: версия $NEXT [skip ci]" || true
            if git push origin HEAD:main; then
              echo "Версия поднята до $NEXT (code $NEXT_CODE)"
              exit 0
            fi
            sleep 5
          done
          echo "Не удалось поднять версию: main постоянно меняется" >&2
          exit 1
