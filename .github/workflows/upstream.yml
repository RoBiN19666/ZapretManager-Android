name: Upstream watch

# Раз в неделю проверяет, появились ли новые коммиты в upstream-сабмодулях.
# Ничего не мержит и не коммитит автоматически: создаёт issue с SHA и diff,
# решение об обновлении принимает человек после ревью и сборки.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodules in worktree
        run: |
          git submodule update --remote --merge app/src/main/cpp/byedpi || true
          git submodule update --remote --merge app/src/main/jni/hev-socks5-tunnel || true
          git submodule update --remote --merge third_party/tgwsproxy || true
          if git diff --quiet && git diff --cached --quiet; then
            echo "Обновлений в upstream нет"
            exit 0
          fi
          git submodule status > upstream-status.txt
          git diff --submodule=short >> upstream-status.txt

      - name: Open issue for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s upstream-status.txt ]; then
            echo "Нечего публиковать"
            exit 0
          fi
          TITLE="Upstream updates $(date -u +%Y-%m-%d)"
          {
            echo "Обнаружены новые коммиты в upstream-сабмодулях."
            echo
            echo "Автоматический merge отключён: обновите сабмодули вручную, прогоните тесты/lint и соберите APK."
            echo
            echo '```'
            cat upstream-status.txt
            echo '```'
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md
